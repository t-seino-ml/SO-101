[project]
name = "so101"
version = "0.1.0"
description = "SO-101 imitation-learning stack: hardware bring-up, camera, dataset, policy, and an integrated app"
requires-python = ">=3.11,<3.12"
dependencies = [
    "lerobot[feetech]",
    "pyserial",
    # DirectShow device names, so a camera can be identified by name instead of by
    # an index Windows is free to reshuffle.
    "pygrabber; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101"]
